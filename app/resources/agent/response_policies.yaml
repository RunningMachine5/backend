# 시연용 내부 대응 정책이다. 실제 운영 시 금융회사의 승인된 정책으로 교체해야 한다.
policies:
  - policy_id: POLICY-VOICE-PHISHING-LOW
    fraud_type: VOICE_PHISHING
    risk_grade: LOW
    notification_required: false
    notification_reason: null
    actions:
      - priority: 1
        action_code: REVIEW_VOICE_PHISHING_EVIDENCE
        action: 보이스피싱 적중 근거를 확인한다
        reason: 낮은 위험도에서도 판정 근거의 유효성을 확인해야 함
        required: true
    checklist:
      - item_code: CHECK_IMPERSONATION_SIGNAL
        label: 기관·대출 사칭 관련 적중 근거 확인
        required: true

  - policy_id: POLICY-VOICE-PHISHING-MEDIUM
    fraud_type: VOICE_PHISHING
    risk_grade: MEDIUM
    notification_required: false
    notification_reason: null
    actions:
      - priority: 1
        action_code: VERIFY_VOICE_PHISHING_CONTEXT
        action: 사칭 유형과 거래 정황을 확인한다
        reason: 대응 가이드 선택에 필요한 사칭 유형 확인이 필요함
        required: true
      - priority: 2
        action_code: REVIEW_RECIPIENT_ACCOUNT
        action: 수취계좌의 이상 정황을 검토한다
        reason: 피해금 이체 가능성을 확인해야 함
        required: true
    checklist:
      - item_code: CHECK_IMPERSONATION_SIGNAL
        label: 기관·대출 사칭 관련 적중 근거 확인
        required: true
      - item_code: CHECK_RECIPIENT_RISK
        label: 수취계좌 위험정보 확인
        required: true

  - policy_id: POLICY-VOICE-PHISHING-HIGH
    fraud_type: VOICE_PHISHING
    risk_grade: HIGH
    notification_required: true
    notification_reason: 고위험 보이스피싱 의심 거래에 대한 고객 확인이 필요함
    actions:
