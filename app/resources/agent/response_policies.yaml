      - priority: 3
        action_code: GUIDE_VOICE_PHISHING_RESPONSE
        action: 보이스피싱 피해 대응 절차 안내를 준비한다
        reason: 고객 확인 결과에 따라 즉시 안내할 수 있어야 함
        required: true
