        reason: 추가 피해 가능성에 대한 신속한 검토가 필요함
        required: true
    checklist:
      - item_code: CHECK_CUSTOMER_CONFIRMATION
        label: 고객 본인 거래 여부 확인
        required: true
      - item_code: CHECK_ADDITIONAL_TRANSACTION
        label: 탐지 이후 추가 거래 발생 여부 확인
        required: true

