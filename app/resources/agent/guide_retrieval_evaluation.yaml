# 시연용 대응 가이드 검색 평가 세트이다. 각 질문의 기대 문서는 사람이 검토해 지정한다.
cases:
  - query_id: VOICE-001
    query: 기관을 사칭한 고위험 송금에서 고객 본인 거래를 어떻게 확인해야 하는가
    fraud_type: VOICE_PHISHING
    audience: MONITORING
    risk_grade: HIGH
    action_codes: [VERIFY_CUSTOMER_TRANSACTION]
    expected_document_ids: [FDS-INTERNAL-VOICE-MONITORING-001]
  - query_id: VOICE-002
    query: 매우 높은 보이스피싱 위험에서 고객에게 안내할 피해구제 순서는 무엇인가
    fraud_type: VOICE_PHISHING
    audience: CUSTOMER
    risk_grade: VERY_HIGH
    action_codes: [GUIDE_VOICE_PHISHING_RESPONSE]
    expected_document_ids: [NPA-PHISHING-RELIEF-001]
  - query_id: VOICE-003
    query: 보이스피싱 의심 거래의 수취계좌를 검토할 때 무엇을 확인해야 하는가
    fraud_type: VOICE_PHISHING
    audience: MONITORING
    risk_grade: MEDIUM
    action_codes: [REVIEW_RECIPIENT_ACCOUNT]
    expected_document_ids: [FDS-INTERNAL-VOICE-MONITORING-001]
  - query_id: VOICE-004
    query: 보이스피싱 의심 고객이 즉시 중단해야 할 행동은 무엇인가
    fraud_type: VOICE_PHISHING
    audience: CUSTOMER
    risk_grade: HIGH
    action_codes: [VERIFY_CUSTOMER_TRANSACTION]
    expected_document_ids: [FDS-INTERNAL-VOICE-CUSTOMER-001]
  - query_id: VOICE-005
    query: 대출빙자와 악성 앱 정황이 함께 있을 때 참고할 보안 점검 내용은 무엇인가
    fraud_type: VOICE_PHISHING
    audience: MONITORING
    risk_grade: HIGH
    action_codes: [GUIDE_SECURITY_CHECK]
    expected_document_ids: [FSI-BLACKECHO-2024-001]

