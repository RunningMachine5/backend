services:
  db:
    image: paradedb/paradedb:latest # PostgreSQL(18) + pgvector + pg_search(BM25)
    container_name: fdshield-db-container
    restart: unless-stopped # 꺼지면 자동으로 재시작
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_DB:-fdshield-db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    configs:
      # 최초 실행(데이터 디렉터리가 비어 있을 때)에만 실행됨
      - source: init_extensions
        target: /docker-entrypoint-initdb.d/00-extensions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-fdshield-db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-fdshield/backend:local}
    container_name: fdshield-backend-container
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:-1234}@db:5432/${POSTGRES_DB:-fdshield-db}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

configs:
  init_extensions:
    content: |
      CREATE EXTENSION IF NOT EXISTS vector;
      CREATE EXTENSION IF NOT EXISTS pg_search;

volumes:
  pgdata:

# 이 파일은 프로젝트 루트에 놓을것
# docker compose up은 현재 디렉터리와 상위 디렉터리만 뒤지기 때문
