services:
  db:
    image: paradedb/paradedb:latest # PostgreSQL(18) + pgvector + pg_search(BM25)
    container_name: fdshield-db-container
    restart: unless-stopped # 꺼지면 자동으로 재시작
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_DB:-fdshield-db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    configs:
      # 최초 실행(데이터 디렉터리가 비어 있을 때)에만 실행됨
      - source: init_extensions
        target: /docker-entrypoint-initdb.d/00-extensions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-fdshield-db}"]
      interval: 5s
      timeout: 5s
      retries: 20

configs:
  init_extensions:
    content: |
      CREATE EXTENSION IF NOT EXISTS vector;
      CREATE EXTENSION IF NOT EXISTS pg_search;

volumes:
  pgdata:

# 기본 docker compose up은 로컬 개발에 필요한 DB만 실행한다.
# Backend 컨테이너까지 확인할 때는 docker-compose.local.yml을 함께 사용한다.
